<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>สกายฟอร์</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, one screen per phase, boarding-pass card for the secret role. */
:root{
  --bg:#E8EEF4; --surface:#F7F9FC; --fg:#0E1B2E; --muted:#51627A; --line:#C6D1DD;
  --accent:#D4451C; --accent-fg:#FFFFFF; --accent-soft:#FADFD5;
  --good:#15764B; --bad:#B3261E; --sky:#285A9C;
  --font-display:"Kanit","Noto Sans Thai",system-ui,sans-serif;
  --font-body:"Noto Sans Thai","Kanit",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1424; --surface:#13223A; --fg:#E8EEF6; --muted:#93A4BA; --line:#2A3B54;
    --accent:#FF7B4F; --accent-fg:#1A0A03; --accent-soft:#3A2218;
    --good:#4CC38A; --bad:#FF8A80; --sky:#7FB0F0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1424; --surface:#13223A; --fg:#E8EEF6; --muted:#93A4BA; --line:#2A3B54;
  --accent:#FF7B4F; --accent-fg:#1A0A03; --accent-soft:#3A2218;
  --good:#4CC38A; --bad:#FF8A80; --sky:#7FB0F0; color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.55;
  padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.brand{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.brand .mark{font-family:var(--font-display);font-weight:700;font-size:44px;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:12px}
.brand .mark svg{width:34px;height:34px;flex:none;color:var(--accent)}
.brand p{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stepper{display:flex;align-items:center;gap:14px}
.stepper .num{font-family:var(--font-display);font-size:32px;font-weight:600;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-family:var(--font-display);font-size:16px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.round{width:48px;padding:0;border-radius:50%;font-size:22px}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.struck{text-decoration:line-through;color:var(--muted);opacity:.65}
.chip.pick[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);text-decoration:none;opacity:1}
.names{display:flex;flex-direction:column;gap:8px}
.names input{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.names label{display:flex;align-items:center;gap:10px}
.names .idx{width:26px;flex:none;font-family:var(--font-display);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}
details.rules summary{cursor:pointer;font-family:var(--font-display);font-weight:600;min-height:32px;display:flex;align-items:center}
details.rules ol{margin:8px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14.5px}

/* pass screen */
.pass{text-align:center;align-items:center;padding:28px 16px;gap:16px}
.pass .who{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.progress{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.progress i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--accent)}

/* boarding pass */
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.ticket .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ticket .tag{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.ticket .big{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.ticket .role{font-size:20px;font-family:var(--font-display);font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.tear{position:relative;height:0;border-top:2px dashed var(--line);margin:14px -20px}
.tear::before,.tear::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tear::before{left:-11px}.tear::after{right:-11px}
.ticket{min-height:470px}
.readbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.readbar i{display:block;height:100%;width:0;background:var(--accent)}
.readnote{font-size:13.5px;color:var(--muted);text-align:center}
.stamp{align-self:flex-start;border:3px solid var(--accent);color:var(--accent);border-radius:10px;padding:2px 14px;font-family:var(--font-display);font-weight:700;font-size:30px;transform:rotate(-4deg);margin:6px 0}

/* play */
.clock{font-family:var(--font-display);font-weight:600;font-size:76px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock.low{color:var(--bad)}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.locgrid{max-height:300px;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.peeks .chip{font-size:14px}
.verdict{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.2}
.verdict.win{color:var(--good)}
.verdict.lose{color:var(--bad)}
table.roles{width:100%;border-collapse:collapse;font-size:14.5px}
table.roles td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
table.roles td{vertical-align:middle}
table.roles td.nm{font-weight:600;white-space:nowrap;padding-right:12px}
table.roles td.avc{width:48px;padding:6px 8px 6px 0}
table.roles tr.isspy td{color:var(--accent);font-weight:600}

/* illustrations */
.av{display:block;flex:none;border-radius:50%}
.scene{position:relative;margin:-20px -20px 10px;height:150px;overflow:hidden;background:#12192A}
.panel .scene{margin:-16px -16px 4px}
.panel.hasscene{overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
.scene .emo{position:absolute;right:12px;bottom:10px;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:36px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.scene.spy svg{border-radius:0}
.rolewrap{display:flex;align-items:center;gap:14px}
.rolewrap .role{min-width:0}
.guessbox{width:100%;min-height:48px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
@media (prefers-reduced-motion:no-preference){.ticket.flip{animation:flip .55s ease-out}@keyframes flip{from{transform:perspective(600px) rotateY(-80deg);opacity:0}to{transform:none;opacity:1}}.clock.hot{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08)}}.ticket,.panel{animation:rise .25s ease-out}@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

</head>

  if (shades) s+=`<rect x="36" y="${cy-3}" width="13" height="9" rx="3" fill="#111"/><rect x="51" y="${cy-3}" width="13" height="9" rx="3" fill="#111"/><rect x="48" y="${cy-1}" width="4" height="2" fill="#111"/>`;
  else if (specs) s+=`<circle cx="43" cy="${cy+2}" r="6.5" fill="none" stroke="#1F2937" stroke-width="1.6"/><circle cx="57" cy="${cy+2}" r="6.5" fill="none" stroke="#1F2937" stroke-width="1.6"/><line x1="49.5" y1="${cy+2}" x2="50.5" y2="${cy+2}" stroke="#1F2937" stroke-width="1.6"/>`;

  if (space) s+=`<circle cx="50" cy="${cy}" r="${r+8}" fill="#BFE3FF" fill-opacity=".35" stroke="#E2E8F0" stroke-width="3"/>`;

  else if (chef) s+=`<g fill="#fff" stroke="#C9D3DE" stroke-width="1"><rect x="34" y="${cy-18}" width="32" height="12"/><circle cx="38" cy="${cy-24}" r="8"/><circle cx="50" cy="${cy-28}" r="9"/><circle cx="62" cy="${cy-24}" r="8"/></g>`;

  else if (hard) s+=`<path d="M29 ${cy-6}Q50 ${cy-36} 71 ${cy-6}Z" fill="#F4C20D"/><rect x="26" y="${cy-8}" width="48" height="5" rx="2" fill="#E0A800"/>`;
  else if (guard) s+=`<path d="M31 ${cy-8}Q31 ${cy-28} 50 ${cy-28}Q69 ${cy-28} 69 ${cy-8}Z" fill="#334155"/><rect x="28" y="${cy-9}" width="44" height="5" rx="2" fill="#1F2937"/><circle cx="50" cy="${cy-17}" r="3" fill="#CBD5E1"/>`;
  else if (doc) s+=`<path d="M32 ${cy-8}Q50 ${cy-30} 68 ${cy-8}Z" fill="#2FA4A9"/>`;
  else if (bride) s+=`<path d="M28 ${cy-4}Q50 ${cy-34} 72 ${cy-4}L77 ${cy+36}L23 ${cy+36}Z" fill="#fff" fill-opacity=".6" stroke="#CBD5E1"/>`;

  return wrap(s);
}

/* ---------- state ---------- */
const PREF_KEY = "skyfall-prefs-v1";
const S = { screen:"setup", n:5, names:[], mins:8, cats:new Set(Object.keys(CATS)), g:null, rev:null, sel:null, wake:null, sound:true };
try {
  const p = JSON.parse(localStorage.getItem(PREF_KEY) || "null");
  if (p) {
    if (p.n >= 3 && p.n <= 10) S.n = p.n;
    if (Array.isArray(p.names)) S.names = p.names.slice(0,10).map(x => String(x||"").slice(0,20));
    if ([5,8,10,15].includes(p.mins)) S.mins = p.mins;
    if (p.sound === false) S.sound = false;
    if (Array.isArray(p.cats) && p.cats.length) S.cats = new Set(p.cats.filter(c => CATS[c]));
    if (!S.cats.size) S.cats = new Set(Object.keys(CATS));
  }
} catch(e) {}
function savePrefs(){ try { localStorage.setItem(PREF_KEY, JSON.stringify({n:S.n, names:S.names, mins:S.mins, sound:S.sound, cats:[...S.cats]})); } catch(e) {} }

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rand = n => Math.floor(Math.random()*n);
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pool = () => LOCS.filter(l => S.cats.has(l.cat));
const nameOf = i => (S.names[i] && S.names[i].trim()) || ("ผู้เล่น " + (i+1));
const fmt = sec => String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0");
const PLANE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';

/* ---------- game logic ---------- */
function newGame(){
  const p = pool();
  const loc = p[rand(p.length)];
  const roles = shuffle(loc.roles.slice().concat(FILLERS));
  const spy = rand(S.n);
  const assign = []; let k = 0;
  for (let i=0;i<S.n;i++) assign.push(i===spy ? null : roles[k++]);
  S.g = { loc, pool:p, spy, assign, first:rand(S.n), struck:new Set(), left:S.mins*60, endAt:0, running:false, over:false, result:null };
  S.rev = { i:0, step:"pass", mode:"deal" };
  S.screen = "reveal";
}
/* ---------- sound and vibration ---------- */
const SFX = {
  ctx:null,
  init(){ try{ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(C) this.ctx=new C(); } if(this.ctx&&this.ctx.state==="suspended") this.ctx.resume(); }catch(e){} },
  tone(f,t0,d,type,vol){
    if(!S.sound||!this.ctx) return;
    try{
      const c=this.ctx,o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t0;
      o.type=type||"sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(vol||.2,s+.012); g.gain.exponentialRampToValueAtTime(0.0001,s+d);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s+d+.03);
    }catch(e){}
  },
  seq(n,type,vol){ n.forEach(([f,t,d])=>this.tone(f,t,d,type,vol)); },
  say(t){
    if(!S.sound||!("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(t); u.lang="th-TH"; u.rate=.95; u.volume=1;
      const v=speechSynthesis.getVoices().find(x=>/^th/i.test(x.lang)); if(v) u.voice=v;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  stopSay(){ try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} },
  vib(p){ try{ if(S.sound && navigator.vibrate) navigator.vibrate(p); }catch(e){} },
  play(name){
    switch(name){
      case "hide":   this.tone(620,0,.07,"sine",.15); break;
      case "ready":  this.tone(740,0,.12,"sine",.14); break;
      case "reveal": this.seq([[523,0,.14],[784,.12,.32]],"triangle",.22); this.vib(30); break;
      case "spy":    this.seq([[196,0,.4],[185,.32,.6],[98,.5,.7]],"sawtooth",.16); this.vib([80,50,80,50,160]); break;
      case "start":  this.seq([[392,0,.12],[523,.12,.12],[659,.24,.12],[784,.36,.3]],"triangle",.22); break;
      case "warn60": this.seq([[988,0,.12],[988,.22,.12]],"square",.14); this.vib([120,80,120]); break;
      case "warn30": this.seq([[988,0,.1],[988,.2,.1],[988,.4,.1]],"square",.15); this.vib([100,60,100,60,100]); break;
      case "tick":   this.tone(880,0,.07,"square",.12); this.vib(25); break;
      case "tickhi": this.tone(1320,0,.09,"square",.17); this.vib(45); break;
      case "end":    this.seq([[220,0,1.1],[165,0,1.1],[110,.05,1.1]],"sawtooth",.22); this.vib([400,120,400]); break;
      case "win":    this.seq([[523,0,.14],[659,.14,.14],[784,.28,.14],[1047,.42,.5]],"triangle",.24); this.vib([60,40,60]); break;
      case "lose":   this.seq([[392,0,.22],[330,.22,.22],[262,.44,.6]],"sawtooth",.15); this.vib(200); break;
    }
  }
};

function startClock(){
  const g = S.g; g.endAt = Date.now() + g.left*1000; g.running = true; g.lastSec = g.left;
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { S.wake = w; }).catch(()=>{}); } catch(e) {}
}
function pauseClock(){ const g=S.g; g.left = Math.max(0, Math.ceil((g.endAt-Date.now())/1000)); g.running=false; }
function finish(winner, reason){
  const g = S.g;
  if (g.running) pauseClock();
  g.result = { winner, reason };
  try { if (S.wake) { S.wake.release(); S.wake=null; } } catch(e) {}
  S.screen = "result";
  SFX.play(winner==="players" ? "win" : "lose");
}

    return `
    <section class="panel pass">
      ${r.mode==="deal"?`<div class="progress" aria-hidden="true">${dots}</div>`:""}
      <p class="label">ส่งโทรศัพท์ให้</p>
      <div class="who">${nm}</div>
      <p class="hint">คนอื่นอย่ามองหน้าจอ</p>
      <button class="btn primary block" data-act="show">ฉันคือ ${nm} ดูบทบาท</button>
      ${r.mode==="peek"?`<button class="btn ghost block" data-act="cancelpeek">ยกเลิก</button>`:""}
    </section>`;
  }
  const isSpy = i===g.spy;
  const last = r.mode==="deal" && i===S.n-1;
  const btn = r.mode==="peek" ? "ซ่อนและกลับไปเล่น" : (last ? "ซ่อนและเริ่มเกม" : "จำได้แล้ว ซ่อนและส่งต่อ");
  r.btnLabel = btn;
  const left = Math.max(0, (r.readUntil||0) - Date.now());
  const body = isSpy ? `
      <div class="scene spy">${spyArt(0, null, "xMidYMin slice")}</div>
      <div class="top"><span class="tag">บัตรขึ้นเครื่อง</span><span class="tag">${nm}</span></div>
      <div class="stamp">สายลับ</div>
      <div class="tear"></div>
      <p class="role">คุณไม่รู้ว่าทุกคนอยู่ที่ไหน ฟังคำตอบของคนอื่นแล้วเดาสถานที่ให้ถูก อย่าให้ใครจับได้</p>`
    : `
      ${scene(g.loc)}
      <div class="top"><span class="tag">บัตรขึ้นเครื่อง</span><span class="tag">${nm}</span></div>
      <p class="label">สถานที่</p>
      <div class="big">${esc(g.loc.name)}</div>
      <div class="tear"></div>
      <p class="label">บทบาทของคุณ</p>
      <div class="rolewrap">${avatar(g.assign[i], g.loc.name, 88)}<p class="role">${esc(g.assign[i])}</p></div>`;
  return `
    <section class="ticket flip">${body}</section>
    <div class="readbar" aria-hidden="true"><i id="readfill" style="width:${Math.min(100,100-left/READ_MS*100).toFixed(0)}%"></i></div>
    <button class="btn primary block" id="hidebtn" data-act="hide" ${left>0?"disabled":""}>${left>0?"อ่านให้ครบก่อน ("+Math.ceil(left/1000)+")":btn}</button>
    <p class="readnote">${WARN_LINES[i%WARN_LINES.length]}</p>`;
}

function vPlay(){
  const g=S.g;
  const sec = g.running ? Math.max(0, Math.ceil((g.endAt-Date.now())/1000)) : g.left;
  const locs = g.pool.map((l,k)=>`<button class="chip${g.struck.has(k)?" struck":""}" data-act="strike" data-v="${k}">${emoOf(l)} ${esc(l.name)}</button>`).join("");
  const peeks = Array.from({length:S.n},(_,k)=>`<button class="chip" data-act="peek" data-v="${k}">${esc(nameOf(k))}</button>`).join("");
  return `
  <section class="panel">
    <p class="label" style="text-align:center">เวลาที่เหลือ</p>
    <div id="clock" class="clock${sec<=30?" low":""}${sec<=10&&sec>0&&g.running?" hot":""}">${fmt(sec)}</div>
    <p style="text-align:center">คนเริ่มถามก่อน: <strong>${esc(nameOf(g.first))}</strong></p>
    <div style="text-align:center">${soundBtn()}</div>
    ${g.warnMsg&&sec>0?`<div class="banner" role="status">${g.warnMsg}</div>`:""}
    ${sec===0?`<div class="banner" role="alert">หมดเวลาแล้ว ทุกคนต้องโหวตจับสายลับตอนนี้</div>`:""}
    <div class="row">
      ${sec>0?`<button class="btn" style="flex:1" data-act="toggle">${g.running?"หยุดเวลา":"เล่นต่อ"}</button>`:""}
    </div>
  </section>
  <div class="row" style="flex-wrap:nowrap">
    <button class="btn primary" style="flex:1" data-act="vote">โหวตจับสายลับ</button>
    <button class="btn" style="flex:1" data-act="guess">สายลับเดาสถานที่</button>
  </div>
  <section class="panel">
    <div class="row between"><h2 class="label">รายชื่อสถานที่</h2><span class="hint">แตะเพื่อขีดฆ่า</span></div>
    <div class="chips locgrid">${locs}</div>
  </section>
  <section class="panel peeks">
    <h2 class="label">ลืมบทบาท</h2>
    <p class="hint">แตะชื่อตัวเอง แล้วดูบทบาทอีกครั้ง คนอื่นอย่าแอบมอง</p>
    <div class="chips">${peeks}</div>
  </section>
  <button class="btn ghost danger block" data-act="quit">เลิกเกมนี้</button>`;
}

function vVote(){
  const g=S.g;
  const chips = Array.from({length:S.n},(_,k)=>`<button class="chip pick" data-act="pickp" data-v="${k}" aria-pressed="${S.sel===k}">${esc(nameOf(k))}</button>`).join("");
  return `
  <section class="panel">
    <h2>โหวตจับสายลับ</h2>
    <p class="hint">ตกลงกันให้ได้ว่าสงสัยใคร แล้วเลือกคนนั้น</p>
    <div class="chips">${chips}</div>
  </section>
  <button class="btn primary block" data-act="confirmvote" ${S.sel===null?"disabled":""}>${S.sel===null?"เลือกผู้ต้องสงสัยก่อน":"ยืนยันจับ "+esc(nameOf(S.sel))}</button>
  <button class="btn ghost block" data-act="back">กลับไปเล่นต่อ</button>`;
}

function vGuess(){
  return `
  <section class="panel">
    <h2>สายลับเดาสถานที่</h2>
    <p>สายลับพูดชื่อสถานที่ที่คิดว่าใช่ให้ทุกคนได้ยิน แล้วให้คนที่รู้สถานที่จริงช่วยกันตัดสินว่าถูกหรือผิด ไม่ต้องตรงเป๊ะ ถ้าใกล้เคียงพอก็ถือว่าถูกได้</p>
    <label class="label" for="guess-text">สายลับตอบว่า (พิมพ์หรือไม่พิมพ์ก็ได้)</label>
    <input class="guessbox" type="text" id="guess-text" maxlength="40" placeholder="เช่น สนามบิน" value="${esc(S.guessText||"")}" autocomplete="off">
  </section>
  <button class="btn primary block" data-act="guessright">ตอบถูก สายลับชนะ</button>
  <button class="btn block" data-act="guesswrong">ตอบผิด ฝ่ายธรรมดาชนะ</button>
  <button class="btn ghost block" data-act="back">กลับไปเล่นต่อ</button>`;
}

function vResult(){
  const g=S.g, r=g.result;
  const rows = Array.from({length:S.n},(_,i)=>`<tr class="${i===g.spy?"isspy":""}"><td class="avc">${i===g.spy?spyArt(40,"52 26 136 136"):avatar(g.assign[i], g.loc.name, 40)}</td><td class="nm">${esc(nameOf(i))}</td><td>${i===g.spy?"สายลับ":esc(g.assign[i])}</td></tr>`).join("");
  return `
  <section class="panel">
    <p class="label">ผลการเล่น</p>
    <div class="verdict ${r.winner==="spy"?"lose":"win"}">${r.winner==="spy"?"สายลับชนะ":"ฝ่ายธรรมดาชนะ"}</div>
    <p>${esc(r.reason)}</p>
  </section>
  <section class="panel hasscene">
    ${scene(g.loc)}
    <p class="label">สถานที่จริง</p>
    <div class="verdict">${esc(g.loc.name)}</div>
    <p>สายลับคือ <strong>${esc(nameOf(g.spy))}</strong></p>
    <div style="overflow-x:auto"><table class="roles"><tbody>${rows}</tbody></table></div>
  </section>
  <button class="btn primary block" data-act="again">เล่นอีกรอบ ผู้เล่นชุดเดิม</button>
  <button class="btn block" data-act="home">กลับหน้าตั้งค่า</button>`;
}

function render(){
  const v = { setup:vSetup, reveal:vReveal, play:vPlay, vote:vVote, guess:vGuess, result:vResult }[S.screen];
  const same = render.last === S.screen && !(S.screen==="reveal");
  const grid = $app.querySelector(".locgrid");
  const gy = grid ? grid.scrollTop : 0, wy = window.scrollY;
  $app.innerHTML = v();
  if (same){
    const ng = $app.querySelector(".locgrid"); if (ng) ng.scrollTop = gy;
    window.scrollTo(0, wy);
  } else window.scrollTo(0,0);
  render.last = S.screen;
}

/* ---------- events ---------- */
document.addEventListener("input", e => {
  const t = e.target;
  if (t && t.dataset && t.dataset.name !== undefined){ S.names[+t.dataset.name] = t.value; savePrefs(); }
  if (t && t.id === "guess-text") S.guessText = t.value;
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  SFX.init();
  const a = b.dataset.act, v = b.dataset.v, g = S.g;
  switch(a){
    case "inc": if (S.n<10){ S.n++; savePrefs(); render(); } break;
    case "dec": if (S.n>3){ S.n--; savePrefs(); render(); } break;
    case "mins": S.mins = +v; savePrefs(); render(); break;
    case "cat": if (S.cats.has(v)){ if (S.cats.size>1) S.cats.delete(v); } else S.cats.add(v); savePrefs(); render(); break;
    case "start": newGame(); render(); break;
    case "sound": S.sound=!S.sound; savePrefs(); SFX.play("hide"); render(); break;
    case "show": S.rev.step="card"; S.rev.readUntil=Date.now()+READ_MS; SFX.play("reveal"); { const li=S.rev.i%WARN_LINES.length; setTimeout(()=>{ if(S.screen==="reveal"&&S.rev.step==="card") SFX.say(WARN_LINES[li]); },600); } render(); break;
    case "cancelpeek": S.screen="play"; render(); break;
    case "hide":
      if (S.rev.readUntil && Date.now() < S.rev.readUntil) break;
      SFX.stopSay();
      if (S.rev.mode==="peek"){ S.screen="play"; render(); }
      else if (S.rev.i < S.n-1){ SFX.play("hide"); S.rev.i++; S.rev.step="pass"; render(); }
      else { startClock(); SFX.play("start"); S.screen="play"; render(); }
      break;
    case "peek": S.rev={ i:+v, step:"pass", mode:"peek" }; S.screen="reveal"; render(); break;
    case "strike": { const k=+v; g.struck.has(k)?g.struck.delete(k):g.struck.add(k); b.classList.toggle("struck"); break; }
    case "toggle": g.running ? pauseClock() : startClock(); render(); break;
    case "vote": if (g.running) pauseClock(); S.sel=null; S.screen="vote"; render(); break;
    case "guess": if (g.running) pauseClock(); S.guessText=""; S.screen="guess"; render(); break;
    case "back": S.screen="play"; render(); break;
    case "pickp": S.sel=+v; render(); break;
    case "confirmvote":
      if (S.sel===g.spy) finish("players", nameOf(S.sel)+" คือสายลับจริงๆ โหวตถูกคน");
      else finish("spy", nameOf(S.sel)+" ไม่ใช่สายลับ โหวตผิดคน สายลับรอดไปได้");
      render(); break;
    case "guessright": case "guesswrong": {
      const txt = (S.guessText||"").trim(), said = txt ? " (ตอบว่า "+txt+")" : "";
      if (a==="guessright") finish("spy", "สายลับเดาสถานที่ถูก"+said+" สถานที่จริงคือ "+g.loc.name);
      else finish("players", "สายลับเดาสถานที่ผิด"+said+" สถานที่จริงคือ "+g.loc.name);
      render(); break;
    }
    case "again": newGame(); render(); break;
    case "home": S.g=null; S.screen="setup"; render(); break;
    case "quit": if (g.running) pauseClock(); S.g=null; S.screen="setup"; try{ if(S.wake){S.wake.release();S.wake=null;} }catch(err){} render(); break;
  }
});

/* ---------- forced reading time (same for everyone) ---------- */
setInterval(() => {
  if (S.screen!=="reveal" || !S.rev || S.rev.step!=="card") return;
  const b = document.getElementById("hidebtn"); if (!b) return;
  const left = Math.max(0, (S.rev.readUntil||0) - Date.now());
  const f = document.getElementById("readfill"); if (f) f.style.width = Math.min(100, 100-left/READ_MS*100)+"%";
  if (left>0){ b.disabled=true; b.textContent="อ่านให้ครบก่อน ("+Math.ceil(left/1000)+")"; }
  else if (b.disabled){ b.disabled=false; b.textContent=S.rev.btnLabel; SFX.play("ready"); }
}, 100);

/* ---------- clock tick ---------- */
setInterval(() => {
  const g = S.g;
  if (S.screen!=="play" || !g || !g.running) return;
  const sec = Math.max(0, Math.ceil((g.endAt-Date.now())/1000));
  const el = document.getElementById("clock");
  if (el){ el.textContent = fmt(sec); el.classList.toggle("low", sec<=30); el.classList.toggle("hot", sec<=10&&sec>0); }
  if (sec!==g.lastSec){
    g.lastSec = sec;
    if (sec===60){ g.warnMsg="เหลือเวลา 1 นาทีสุดท้าย"; SFX.play("warn60"); render(); }
    else if (sec===30){ g.warnMsg="เหลือ 30 วินาที รีบตัดสินใจ"; SFX.play("warn30"); render(); }
    else if (sec===10){ g.warnMsg="10 วินาทีสุดท้าย"; SFX.play("tick"); render(); }
    else if (sec<=5 && sec>0) SFX.play("tickhi");
    else if (sec<10 && sec>0) SFX.play("tick");
  }
  if (sec===0){ g.running=false; g.left=0; g.warnMsg=""; SFX.play("end"); render(); }
}, 250);

render();
</script>

</body>
</html>
